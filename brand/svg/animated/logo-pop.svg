<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <style>
    @keyframes th-poA {0%,40%{transform:scale(1);opacity:1}50%,90%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes th-poB {0%,40%{transform:scale(0);opacity:0}52%{transform:scale(1.08);opacity:1}56%,90%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
    .th-po-a, .th-po-b {
      transform-box: view-box;
      transform-origin: center;
      animation: 6s ease-in-out infinite;
    }
    .th-po-a { animation-name: th-poA; }
    .th-po-b { animation-name: th-poB; }
    @media (prefers-reduced-motion: reduce) {
      .th-po-a, .th-po-b { animation: none; }
      .th-po-b { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="th-po-sq"><rect x="112" y="112" width="800" height="800" rx="180"/></clipPath>
    <clipPath id="th-po-pill"><rect x="192" y="382" width="640" height="260" rx="130" transform="rotate(-45 512 512)"/></clipPath>
    <clipPath id="th-po-pv"><rect x="422" y="212" width="180" height="600" rx="90"/></clipPath>
    <clipPath id="th-po-ph"><rect x="212" y="422" width="600" height="180" rx="90"/></clipPath>
  </defs>
  <g clip-path="url(#th-po-sq)">
    <rect x="112" y="112" width="800" height="800" fill="#E02128"/>
    <polygon points="404,912 912,404 912,912" fill="#0B8A44"/>
  </g>
  <g class="th-po-a">
    <rect x="192" y="382" width="640" height="260" rx="130" transform="rotate(-45 512 512)" fill="none" stroke="#FFFFFF" stroke-width="40"/>
    <g clip-path="url(#th-po-pill)">
      <rect x="192" y="382" width="640" height="260" rx="130" transform="rotate(-45 512 512)" fill="#FFFFFF"/>
      <rect x="192" y="382" width="320" height="260" transform="rotate(-45 512 512)" fill="#0B8A44"/>
      <path d="M 344 704 Q 302 662 310 606" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    </g>
  </g>
  <g class="th-po-b">
    <rect x="212" y="422" width="600" height="180" rx="90" fill="none" stroke="#FFFFFF" stroke-width="40"/>
    <g clip-path="url(#th-po-ph)">
      <rect x="212" y="422" width="300" height="180" fill="#0B8A44"/>
      <rect x="512" y="422" width="300" height="180" fill="#FFFFFF"/>
    </g>
    <rect x="422" y="212" width="180" height="600" rx="90" fill="none" stroke="#FFFFFF" stroke-width="40"/>
    <g clip-path="url(#th-po-pv)">
      <rect x="422" y="212" width="180" height="390" fill="#FFFFFF"/>
      <rect x="422" y="622" width="180" height="190" fill="#1565C0"/>
      <path d="M 462 748 Q 442 708 446 652" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    </g>
